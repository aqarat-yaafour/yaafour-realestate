<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#c62828">
  <link rel="icon" href="data:,">
  <title>المنيو</title>
  <link rel="preload" href="../assets/fonts/tajawal-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../assets/fonts/tajawal-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../assets/css/style.css">
  <noscript><style>.js-only { display: none; }</style></noscript>
</head>
<body>
  <header class="hero">
    <h1 id="restaurant-name">المنيو</h1>
    <p id="restaurant-tagline" class="tagline"></p>
    <p id="restaurant-hours" class="hours"></p>
  </header>

  <nav id="category-nav" class="category-nav" aria-label="التصنيفات"></nav>

  <main id="menu" class="menu">
    <p class="status js-only">جارٍ تحميل المنيو…</p>
    <noscript><p class="status">لعرض المنيو يلزم تفعيل JavaScript في المتصفح.</p></noscript>
  </main>

  <footer class="footer">
    <p id="restaurant-note"></p>
  </footer>

  <aside id="order-bar" class="order-bar" aria-label="الطلب" hidden>
    <section id="order-sheet" class="order-sheet" aria-label="طلبك" hidden>
      <ul id="order-lines" class="order-lines"></ul>
      <p id="order-warning" class="order-warning" role="alert" hidden></p>
      <button id="order-clear" class="order-clear" type="button">إفراغ الطلب</button>
    </section>
    <div class="order-row">
      <button id="order-toggle" class="order-toggle" type="button" aria-expanded="false" aria-controls="order-sheet"></button>
      <a id="whatsapp-btn" class="whatsapp-btn" target="_blank" rel="noopener">أرسل عبر واتساب</a>
    </div>
  </aside>

  <div id="order-live" class="sr-only" aria-live="polite"></div>

  <script src="../assets/js/order.js"></script>
  <script src="../assets/js/menu.js"></script>
</body>
</html>
